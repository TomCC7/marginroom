<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Marginroom · 文稿</title>
<style>
:root{--paper:#fffefa;--canvas:#f4f3ee;--ink:#262d2a;--muted:#68736c;--line:#e1e5dd;--accent:#285d48;--soft:#eaf2ec;--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--serif:"Noto Serif CJK SC","Songti SC",Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans)}button,input,textarea,select{font:inherit;color:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;min-height:44px;border:0;border-radius:7px;padding:0 14px;background:transparent}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit}button.primary{background:var(--accent);color:white}button.primary:hover{background:#174733}button:disabled{opacity:.5;cursor:wait}.danger{color:#9c3e34!important}.muted{color:var(--muted)}[hidden]{display:none!important}.top{height:84px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1100px)/2));gap:20px;background:var(--paper)}.brand{font:24px Georgia,serif;letter-spacing:-1px;text-decoration:none;white-space:nowrap}.import{font-size:13px}.home{max-width:960px;margin:auto;padding:62px 30px 100px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:28px}h1{font:30px/1.5 var(--serif);margin:0;letter-spacing:-.03em}.heading span{font-size:12px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px}.tabs{display:flex;gap:5px;flex-shrink:0}.tabs button{font-size:14px}.selected{background:var(--soft);color:var(--accent);font-weight:600}.searchbox{margin-left:auto;position:relative;max-width:300px;flex:1}.searchbox span{position:absolute;top:11px;left:13px;color:var(--muted);font-size:18px}input[type=search]{width:100%;height:44px;border:1px solid var(--line);border-radius:7px;background:transparent;padding:0 12px 0 38px}.listnote{display:flex;justify-content:space-between;gap:12px;padding:16px 0 8px;font-size:12px;color:var(--muted)}.listnote button{font-size:12px;min-height:24px;padding:0 4px;text-decoration:underline;text-underline-offset:4px}.rows{list-style:none;margin:0;padding:0}.row{display:flex;align-items:center;border-bottom:1px solid var(--line);position:relative;gap:16px}.doc{display:flex;align-items:flex-start;gap:17px;flex:1;min-width:0;padding:24px 0;text-decoration:none}.doc:hover .title{color:var(--accent)}.fileicon{width:25px;flex-shrink:0;color:#88938a;padding-top:3px}.fileicon svg{width:22px;height:27px;fill:none;stroke:currentColor;stroke-width:1.2}.title{font-size:17px;line-height:1.65;overflow-wrap:anywhere;display:block}.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);margin-top:8px}.pending{color:var(--accent)}.more{font-size:22px;width:44px;padding:0;flex-shrink:0}.empty{padding:60px 12px;text-align:center}.empty h2{font-size:19px;font-weight:500}.empty p{color:var(--muted);max-width:440px;margin:12px auto 22px}.menu{position:absolute;right:0;top:65%;background:var(--paper);border:1px solid var(--line);box-shadow:0 8px 26px #23382416;border-radius:8px;min-width:190px;z-index:10;padding:6px}.menu button{display:block;width:100%;text-align:left;font-size:13px}.toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 18px;border-radius:8px;z-index:100;max-width:calc(100vw - 32px);font-size:13px;text-align:center}dialog{padding:0;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);max-width:560px;width:calc(100% - 32px);max-height:calc(100dvh - 32px);box-shadow:0 24px 100px #172a2530}dialog::backdrop{background:#172a254d}.modalbody{padding:28px;overflow-y:auto;min-height:0}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.modalhead h2{font-size:21px;font-weight:500;margin:0}.close{font-size:23px;width:38px;padding:0}.modalfoot{padding:16px 28px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:var(--paper);flex-shrink:0}.modalfoot button{font-size:13px}.modalwrap{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}.upload{display:block;padding:27px 14px;border:1px dashed #a7b5a8;border-radius:8px;text-align:center;background:#f7f9f3;font-size:15px}.upload input{display:block;width:100%;font-size:12px;margin:17px 0 0}.small{font-size:12px;color:var(--muted)}.field{display:block;margin:20px 0;font-size:13px}.field input{display:block;margin-top:9px;width:100%;max-width:100%;font-size:12px}.paste{margin-top:22px}.paste summary{font-size:13px;cursor:pointer;color:var(--accent)}.paste textarea{width:100%;min-height:155px;margin-top:12px;padding:12px;background:transparent;border:1px solid var(--line);border-radius:6px;font:12px/1.6 ui-monospace,monospace;resize:vertical}.paste input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:transparent}.error{color:#9c3e34;font-size:13px;margin:14px 0 0}.error:empty{display:none}.sharelink{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--canvas);font:12px/1.6 ui-monospace,monospace}.warn{background:#f8edbd70;padding:12px;border-radius:6px;font-size:13px}.image-list{max-height:160px;overflow:auto;overflow-wrap:anywhere;padding-left:20px}.doc>span:last-child{min-width:0}
@media(max-width:600px){.top{height:72px;padding:0 20px;gap:12px}.brand{font-size:23px}.import{padding:0 12px}.home{padding:34px 20px 85px}.heading{margin-bottom:23px}.heading h1{font-size:27px}.toolbar{align-items:stretch;flex-direction:column;gap:18px;padding-bottom:18px}.tabs{gap:4px}.tabs button{padding:0 14px}.searchbox{margin:0;max-width:none;flex:auto}.listnote{font-size:11px;align-items:center;padding-top:15px}.doc{gap:12px;padding:21px 0}.title{font-size:16px}.meta{font-size:11px;gap:5px 12px}.row{gap:5px}.fileicon{width:20px}.fileicon svg{width:18px}.more{width:36px}.modalbody{padding:22px}.modalfoot{padding:14px 22px}.modalhead h2{font-size:20px}.upload{padding:20px 10px}.heading span{font-size:11px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">Marginroom</a><button class="primary import" id="import">＋ 导入 HTML</button></header>
<main class="home"><div class="heading"><h1>文稿</h1><span>从上次停下的地方继续</span></div><div class="toolbar"><nav class="tabs" aria-label="文稿视图"><button id="recent" class="selected" aria-pressed="true">最近打开</button><button id="mine" aria-pressed="false">我的文稿</button></nav><label class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索文稿标题" placeholder="搜索文稿标题"></label></div><div class="listnote"><span id="context">此浏览器打开过的文稿</span><button id="clear">清空记录</button></div><ul class="rows" id="rows" aria-live="polite"></ul></main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modalwrap"><div class="modalbody" id="modalbody"></div><div class="modalfoot" id="modalfoot"></div></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/index.js"></script>
<script type="module" src="/feedback.js"></script>
</body>
</html>
