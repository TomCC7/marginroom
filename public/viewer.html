<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Marginroom · 审稿</title><link rel="stylesheet" href="/review-v3.css"></head><body data-review-v3>
<svg style="display:none" aria-hidden="true"><symbol id="i-message" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-4 3 2-7a8 8 0 1 1 17-4Z"/></symbol><symbol id="i-panel" viewBox="0 0 24 24"><path d="M3 4h18v16H3ZM14 4v16M17 8h2M17 12h2"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="i-page" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z M14 3v5h5M9 12h7M9 16h7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol></svg>

<header class="topbar"><button id="nav-toggle" class="icon" aria-label="收起文稿导航" aria-expanded="true">☰</button><div class="brand">Marginroom<span style="color:#92a38c">.</span></div><div class="separator"></div><div class="document-title" id="hs-docname">文稿</div><div class="saved" id="hs-status"><i></i><span class="txt">正在连接…</span></div><div class="header-tools"><div class="modes" aria-label="文稿模式"><button data-mode="read" class="selected">浏览</button><button data-mode="suggest">批注</button></div><button class="show-discussion" aria-label="打开批注"><svg><use href="#i-panel"/></svg>批注栏 <span class="total" style="margin-left:5px">0</span></button></div><button class="person" id="name-btn" aria-label="修改审稿姓名"><span class="avatar my-avatar">访</span><span class="person-name">访客</span></button><button class="share primary" id="share-btn">分享</button><button class="icon" id="more-btn" aria-label="更多操作"><svg><use href="#i-more"/></svg></button></header>
<div id="hs-warn"></div><div class="workspace"><div id="nav-shade" hidden></div><nav class="nav" aria-label="文章导航"><div class="nav-heading"><p class="nav-label">文稿 / REVIEW</p><button id="nav-close" aria-label="收起导航">×</button></div><button class="active" id="nav-article"><svg><use href="#i-page"/></svg>文章正文</button><button id="nav-comments"><svg><use href="#i-panel"/></svg>批注栏 <span class="total">0</span></button><div style="height:32px"></div><p class="nav-label">文章目录</p><div id="toc"></div></nav>
<main class="main"><div class="view-switch" aria-label="主视图"><button data-view="article" class="selected">文稿视图</button><button data-view="list">批注列表 <span class="total">0</span></button></div>
<article class="paper" id="article"><div id="hs-doc-root">正在加载文稿…</div></article><section id="annotation-list" hidden aria-label="批注列表"><div class="list-heading"><div class="eyebrow">REVIEW / 全部批注</div><h1>批注列表</h1><p class="quiet">按记录审阅，点选一条即可回到原文与对应讨论。</p></div><div class="list-filters"><div class="filters" aria-label="处理状态"><button data-status="all" class="selected">全部状态</button><button data-status="open">未处理</button><button data-status="done">已处理</button></div><div class="filters" aria-label="批注类型"><button data-type="all" class="selected">全部类型</button><button data-type="comment">评论</button><button data-type="suggestion">修改建议</button></div></div><p id="list-summary" class="quiet"></p><div id="list-records"></div><p class="discussion-note">已连接真实批注记录 · 状态与正文同步</p></section></main>
<aside class="discussion" id="discussion" aria-label="批注"><div class="discussion-head"><h2>批注</h2><span class="count total">2</span><button class="icon close-drawer" aria-label="关闭批注，返回正文"><svg><use href="#i-close"/></svg></button></div><div class="filters"><button data-filter="open" class="selected">未处理 <span class="total">0</span></button><button data-filter="done">已处理</button><button data-filter="all">全部记录</button></div><div id="threads"></div><p class="discussion-note">每条讨论都对应正文中的标记。<br>段内原位建议；一次提交一个段落。<br>⌘/Ctrl+Enter 提交，Esc 取消未提交草稿。</p></aside></div>
<footer class="dock"><div id="mobile-selection" hidden role="group" aria-label="选中文字批注"><span role="status">已选文字</span><button id="mobile-add-comment" class="primary" type="button">写批注</button><button id="mobile-suggest" type="button">建议修改</button><button id="cancel-selection" type="button" aria-label="取消选择并返回浏览">浏览</button></div><div class="modes" aria-label="手机文稿模式"><button data-mode="read" class="selected">浏览</button><button data-mode="suggest">批注</button></div><button class="comment-toggle"><svg><use href="#i-panel"/></svg>批注栏 <span class="total">0</span></button></footer>
<div class="selection-context" id="selection-context" hidden><span id="target-label"></span><div id="target-navigation" hidden><button id="target-parent" type="button">父元素</button><button id="target-child" type="button">子元素</button></div><button class="selection-action" id="selection-action"><svg><use href="#i-message"/></svg>写批注</button><button id="selection-suggest" type="button">建议修改</button></div>
<div class="popover" id="popover" hidden></div><div class="shade" id="shade" hidden></div><section class="modal" id="composer" role="dialog" aria-modal="true" aria-labelledby="composer-title" hidden><button id="close-composer" class="icon" type="button" aria-label="关闭批注编辑器">×</button><h2 id="composer-title">添加批注</h2><div class="quote" id="selected-quote"></div><label for="comment-body">你的意见</label><textarea id="comment-body" placeholder="写下与这段文字有关的想法…"></textarea><p class="local-note">提交后保存到此文稿，其他审稿人可见</p><div class="modal-actions"><button id="cancel-comment">取消</button><button id="send-comment" class="primary">写批注</button></div></section><div class="toast" id="toast" role="status" hidden></div>
<aside id="hs-versions" aria-label="版本历史"></aside><div class="draft-actions" id="draft-actions" hidden><span>未提交建议</span><button id="cancel-draft">取消</button><button id="submit-draft" class="primary">提交建议</button></div><script type="module" src="/review-v3.js"></script></body></html>
