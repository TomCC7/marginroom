services:
  app:
    build: .
    image: marginroom-private-alpha:local
    init: true
    stop_grace_period: ${MMW_STOP_GRACE_PERIOD:-35s}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: "3939"
      HS_DB_PATH: /data/app.db
      HS_DOCS_DIR: /data/docs
      MMW_MAINTENANCE_FILE: /data/maintenance.flag
      MMW_SHUTDOWN_TIMEOUT_MS: ${MMW_SHUTDOWN_TIMEOUT_MS:-30000}
    ports:
      - "127.0.0.1:${MMW_PORT:-3939}:3939"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3939/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  app-data:
